<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aethex OS // Autonomous Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-mono min-h-screen flex flex-col justify-between p-4">
    <!-- Header -->
    <header class="flex justify-between items-center border-b border-cyan-800 pb-4 mb-4">
        <div>
            <h1 class="text-cyan-400 font-bold tracking-wider">AETHEX OS //</h1>
            <p class="text-cyan-300 text-sm">AUTONOMOUS CORE</p>
        </div>
        <div class="flex gap-2">
            <button class="bg-slate-900 border border-cyan-800 text-cyan-400 px-3 py-1 text-xs rounded">Memory: 0 Items</button>
            <button class="bg-cyan-500 text-slate-950 font-bold px-3 py-1 text-xs rounded">Neural Chat</button>
            <button class="bg-slate-900 border border-cyan-800 text-cyan-400 px-3 py-1 text-xs rounded">Memory Vault</button>
        </div>
    </header>

    <!-- Main Chat Area -->
    <main class="flex-1 overflow-y-auto space-y-4 max-w-3xl mx-auto w-full">
        <!-- Initial Message -->
        <div class="bg-slate-900/80 border border-cyan-900/50 p-4 rounded-lg shadow-lg">
            <h2 class="text-cyan-400 font-bold mb-2">[Aethex System Initialized]</h2>
            <p class="text-sm text-slate-300">Main Aethex OS ka autonomous neural engine hoon. Aap jo bhi sawal poochenge; agar memory mein nahi hoga, toh yeh khud Google se search karega, error detect karega, seekhega aur save kar lega!</p>
        </div>

        <!-- Chat Container -->
        <div id="chat-container" class="space-y-4">
            <!-- Dynamic messages will appear here -->
        </div>
    </main>

    <!-- Input Form -->
    <footer class="mt-4 pt-4 border-t border-cyan-900">
        <form id="chat-form" class="flex gap-2 max-w-3xl mx-auto">
            <input type="text" id="user-input" placeholder="Aethex se kuch poochein (e.g. What is computer)" class="flex-1 bg-slate-900 border border-cyan-800 rounded px-4 py-2 text-sm text-slate-100 focus:outline-none focus:border-cyan-400">
            <button type="submit" class="bg-cyan-400 text-slate-950 font-bold px-6 py-2 rounded hover:bg-cyan-300 transition">Execute</button>
        </form>
    </footer>

    <script>
        const API_KEY = "AIzaSyCDQkYme2NDH4duBLF7V4Zhf8ssm5P82o4";
        const SEARCH_ENGINE_ID = "94a550da5cf4841ee";

        document.getElementById('chat-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const inputField = document.getElementById('user-input');
            const query = inputField.value.trim();
            if (!query) return;

            const container = document.getElementById('chat-container');
            
            // Append user query
            container.innerHTML += `<div class="bg-cyan-950/30 border border-cyan-800/50 p-3 rounded text-right text-cyan-200 text-sm ml-auto max-w-xl">${query}</div>`;
            inputField.value = '';

            // Loading state
            const loadingId = 'loading-' + Date.now();
            container.innerHTML += `<div id="${loadingId}" class="bg-slate-900 border border-cyan-900 p-3 rounded text-cyan-400 text-sm animate-pulse">Aethex Neural Core is searching...</div>`;
            container.scrollTop = container.scrollHeight;

            try {
                // Google Custom Search API Call
                const url = `https://www.googleapis.com/customsearch/v1?key=${API_KEY}&cx=${SEARCH_ENGINE_ID}&q=${encodeURIComponent(query)}`;
                const response = await fetch(url);
                const data = await response.json();

                document.getElementById(loadingId).remove();

                if (data.error) {
                    container.innerHTML += `<div class="bg-red-950/40 border border-red-900 p-3 rounded text-red-400 text-sm">❌ [Google API Error]: ${data.error.message} (Code: ${data.error.code})</div>`;
                } else if (data.items && data.items.length > 0) {
                    const snippet = data.items[0].snippet;
                    const title = data.items[0].title;
                    const link = data.items[0].link;
                    container.innerHTML += `
                        <div class="bg-slate-900 border border-cyan-900 p-4 rounded text-slate-200 text-sm space-y-2">
                            <div class="text-cyan-400 font-bold">AETHEX NEURAL CORE</div>
                            <div>${snippet}</div>
                            <a href="${link}" target="_blank" class="text-xs text-cyan-500 underline block truncate">Source: ${title}</a>
                        </div>`;
                } else {
                    container.innerHTML += `<div class="bg-slate-900 border border-cyan-900 p-3 rounded text-yellow-400 text-sm">⚠️ No relevant search results found.</div>`;
                }
            } catch (err) {
                document.getElementById(loadingId)?.remove();
                container.innerHTML += `<div class="bg-red-950/40 border border-red-900 p-3 rounded text-red-400 text-sm">❌ [Network Error]: ${err.message}</div>`;
            }
            container.scrollTop = container.scrollHeight;
        });
    </script>
</body>
</html>
